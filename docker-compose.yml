version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: money_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: money_management
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - money-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: money_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - money-network

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: money_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5673:5672"   # AMQP port
      - "15673:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - money-network

  # Backend API (NestJS)
  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: money_backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/money_management?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      # One queue per event type. A slow handler on one queue (e.g. the AI
      # fan-out for transaction.created) can no longer starve unrelated
      # work like notifications.
      RABBITMQ_TRANSACTION_QUEUE: transaction.events
      RABBITMQ_SUBSCRIPTION_QUEUE: subscription.events
      RABBITMQ_NOTIFICATION_QUEUE: notification.events
      # NOTE: These are LOCAL-DEV-ONLY secrets. They are 64+ characters of
      # random-looking material, long enough to pass the runtime length
      # check, and they are NOT on the placeholder denylist. Never reuse
      # these values for any deployed environment — generate new ones with
      # `openssl rand -hex 32`.
      JWT_SECRET: dev_only_a7f3b2c8d4e6f1a9b3c5d7e9f1a3b5c7d9e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_SECRET: dev_only_b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9
      REFRESH_TOKEN_EXPIRES_IN: 7d
      INTERNAL_API_TOKEN: dev_only_c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8081,http://localhost:19006
      BCRYPT_ROUNDS: 10
      AI_SERVICE_URL: http://ai-service:8000/api/v1
      AI_TIMEOUT_MS: 30000
      LOG_LEVEL: debug
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - money-network

  # AI Service (FastAPI)
  ai-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.ai
    container_name: money_ai_service
    environment:
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: INFO
      ENVIRONMENT: development
      # Must match the backend's INTERNAL_API_TOKEN above.
      INTERNAL_API_TOKEN: dev_only_c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8081
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - money-network

  # PGAdmin (Database Management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: money_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@moneymind.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - money-network

  # Redis Commander (Redis UI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: money_redis_commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - money-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  pgadmin_data:

networks:
  money-network:
    driver: bridge
