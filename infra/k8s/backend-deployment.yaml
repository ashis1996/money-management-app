apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: money-management
  labels:
    app: backend
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        version: v1
    spec:
      containers:
        - name: backend
          image: moneymind/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: money-secrets
                  key: database-url
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: RABBITMQ_URL
              value: "amqp://rabbitmq:5672"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: money-secrets
                  key: jwt-secret
            - name: REFRESH_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: money-secrets
                  key: refresh-token-secret
            # Shared secret required by the ai-service to accept calls from
            # this backend. Both pods must read the same value.
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: money-secrets
                  key: internal-api-token
            - name: ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: money-secrets
                  key: allowed-origins
                  optional: true
            # AI service includes the /api/v1 prefix so AiProxyService can
            # append paths like /sms/parse directly without doubling the
            # version segment.
            - name: AI_SERVICE_URL
              value: "http://ai-service/api/v1"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # NestJS sets a global prefix of /api/v1 in main.ts. The previous
          # `/health` path matched no route and probes silently failed.
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: money-management
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 3000
      name: http
  type: ClusterIP
