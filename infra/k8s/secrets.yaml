# IMPORTANT: This is a TEMPLATE only. Never commit real secrets.
# In production, create the Secret out-of-band so the values are never
# checked into git, e.g.:
#
#   kubectl create secret generic money-secrets \
#     --from-literal=database-url='postgresql://...' \
#     --from-literal=jwt-secret="$(openssl rand -hex 32)" \
#     --from-literal=refresh-token-secret="$(openssl rand -hex 32)" \
#     --from-literal=internal-api-token="$(openssl rand -hex 32)" \
#     --from-literal=postgres-password='your-password' \
#     --from-literal=rabbitmq-password='your-password' \
#     --from-literal=allowed-origins='https://app.example.com' \
#     --from-literal=ai-allowed-origins='https://app.example.com' \
#     --from-literal=openai-api-key='your-key' \
#     -n money-management
#
# Or use a real secret manager (AWS Secrets Manager via External Secrets,
# HashiCorp Vault, GCP Secret Manager, Sealed Secrets, etc.).

apiVersion: v1
kind: Secret
metadata:
  name: money-secrets
  namespace: money-management
type: Opaque
stringData:
  # Replace EVERY value before applying. The backend will refuse to boot
  # if jwt-secret or refresh-token-secret matches the placeholder values
  # below or is shorter than 32 characters.
  database-url: "REPLACE_ME_WITH_REAL_DATABASE_URL"
  jwt-secret: "REPLACE_ME_WITH_32_PLUS_RANDOM_BYTES_OPENSSL_RAND_HEX_32"
  refresh-token-secret: "REPLACE_ME_WITH_32_PLUS_RANDOM_BYTES_OPENSSL_RAND_HEX_32"
  internal-api-token: "REPLACE_ME_WITH_32_PLUS_RANDOM_BYTES_OPENSSL_RAND_HEX_32"
  postgres-password: "REPLACE_ME"
  rabbitmq-password: "REPLACE_ME"
  allowed-origins: "https://app.example.com"
  ai-allowed-origins: "https://app.example.com"
  openai-api-key: ""
  anthropic-api-key: ""
