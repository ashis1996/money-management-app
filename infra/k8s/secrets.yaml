apiVersion: v1
kind: Secret
metadata:
  name: money-secrets
  namespace: money-management
type: Opaque
stringData:
  database-url: "postgresql://postgres:postgres@postgres:5432/money_management?schema=public"
  jwt-secret: "change-this-to-a-secure-random-string-minimum-32-characters"
  postgres-password: "postgres"
  rabbitmq-password: "guest"
  openai-api-key: ""
  anthropic-api-key: ""
