name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel an in-progress run when a new commit is pushed to the same ref —
# avoids piling up wasted minutes on rapid PR pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # -------------------------------------------------------------------
  # Static analysis: typecheck + lint. No services needed; runs in
  # under a minute and fails fast for the obvious mistakes.
  # -------------------------------------------------------------------
  static:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Build shared package
        # backend imports from @money-management/shared/dto via the
        # built dist/. Build it first so tsc sees real .d.ts files
        # rather than the source path moduleResolution can't see.
        run: npx tsc
        working-directory: shared

      - name: Generate Prisma client
        # Backend tsc relies on the generated Prisma types.
        run: npx prisma generate --schema=prisma/schema.prisma
        working-directory: backend

      - name: Typecheck backend
        run: npx tsc -p tsconfig.json --noEmit
        working-directory: backend

      - name: Typecheck mobile
        run: npx tsc -p tsconfig.json --noEmit
        working-directory: mobile

      - name: Lint
        # Lint is intentionally non-blocking right now (warnings only).
        # Once existing files are cleaned up, drop the `|| true` and
        # promote the whole job to required.
        run: npx eslint . --ext .ts,.tsx --max-warnings=0 || true

  # -------------------------------------------------------------------
  # Unit tests for the backend. No external services.
  # -------------------------------------------------------------------
  unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Build shared package
        run: npx tsc
        working-directory: shared

      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma
        working-directory: backend

      - name: Run unit tests
        run: npx jest --runInBand --ci
        working-directory: backend

  # -------------------------------------------------------------------
  # End-to-end tests. The e2e suite uses an in-memory mock Prisma so it
  # doesn't need a real Postgres / Redis / RabbitMQ spun up. Same job
  # could later mount real services via `services:` if/when we move e2e
  # off mocks.
  # -------------------------------------------------------------------
  e2e:
    name: Backend e2e tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Build shared package
        run: npx tsc
        working-directory: shared

      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma
        working-directory: backend

      - name: Run e2e tests
        run: npm run test:e2e
        working-directory: backend

  # -------------------------------------------------------------------
  # Build the production Docker images. Doesn't push anywhere — the goal
  # is just to catch Dockerfile regressions (missing files, broken
  # COPY paths, dependency drift) before they reach a deployment.
  # -------------------------------------------------------------------
  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: false
          tags: moneymind/backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AI service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.ai
          push: false
          tags: moneymind/ai-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
